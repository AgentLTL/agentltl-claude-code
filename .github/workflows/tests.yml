name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: scripts/setup.sh --dev
      - name: Test
        run: |
          py=.venv/bin/python; [ -x "$py" ] || py=.venv/Scripts/python.exe   # Windows layout
          "$py" -m pytest -q
