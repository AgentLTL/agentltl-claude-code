name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: scripts/setup.sh --dev
      - name: Test
        run: .venv/bin/pytest -q
